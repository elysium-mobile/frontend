name: Android CI/CD - Firebase Distribution

on:
  push:
    branches:
      - master

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        id: setup-java
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate secrets.properties
        run: |
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> secrets.properties
          echo "API_KEY_GEMINI=${{ secrets.API_KEY_GEMINI }}" >> secrets.properties
          echo "GOOGLE_OAUTH_CLIENT=${{ secrets.GOOGLE_OAUTH_CLIENT }}" >> secrets.properties
          echo "API_KEY_EXTERNAL_SERVICE=${{ secrets.API_KEY_EXTERNAL_SERVICE }}" >> secrets.properties

      - name: Build APK with Java 21 Force
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x test

      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@v2.2.2
        with:
          args: appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups testers-android
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_CREDENTIALS }}